name: build-apk
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Keystore de la casa (si hay secrets)
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/levodev.p12"; echo "KEYSTORE_PATH=$RUNNER_TEMP/levodev.p12" >> "$GITHUB_ENV"; echo "firma: RELEASE"; else echo "firma: debug (sin KEYSTORE_B64)"; fi
      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon --stacktrace && cp app/build/outputs/apk/release/app-release.apk LevoPrint.apk
      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: LevoPrint-apk
          path: LevoPrint.apk
          if-no-files-found: error

      # Publica el APK a la URL estable que usan los botones de descarga de
      # la consola (mi negocio > estaciones). Si no hay SUPABASE_SERVICE_KEY
      # el paso NO falla: solo deja el artifact y avisa.
      - name: Publicar al bucket de descargas (si hay service key)
        env:
          SB_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          if [ -z "$SB_KEY" ]; then echo "Sin SUPABASE_SERVICE_KEY: no publico al bucket (queda solo el artifact)."; exit 0; fi
          echo "Publicando LevoPrint.apk al bucket descargas/levoprint ..."
          code=$(curl -sS -o /tmp/r.txt -w "%{http_code}" -X POST \
            "https://krfljsososdakbatevci.supabase.co/storage/v1/object/descargas/levoprint/LevoPrint.apk" \
            -H "Authorization: Bearer $SB_KEY" \
            -H "x-upsert: true" \
            -H "Content-Type: application/vnd.android.package-archive" \
            --data-binary @LevoPrint.apk)
          echo "HTTP $code"; cat /tmp/r.txt; echo
          [ "$code" = "200" ] || { echo "Fallo la publicacion al bucket"; exit 1; }
          echo "APK publicado a descargas/levoprint/LevoPrint.apk"
