name: build-apk
# [QA LP-F3 · ALTO 1] Un merge a main ya NO publica solo: el CI se lanza a mano (Actions -> Run workflow).
# [RT-1 · 11-nov] Este repo es PUBLICO: el CI ya NO usa SUPABASE_SERVICE_KEY ni publica al bucket.
# Solo compila, prueba y deja los artifacts (APK + LevoPrint.json validado). La publicacion la hace
# Luis desde su PC con tools/publicar_bucket.mjs (la llave nunca sale de su .env local).
on:
  workflow_dispatch:
    inputs:
      notas:
        description: 'Notas de la version para LevoPrint.json (aviso de actualizacion del APK)'
        type: string
        default: ''
# [RT-1] GITHUB_TOKEN con el minimo: solo lectura del codigo.
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          # El default del action incluye el paquete legacy 'tools' (ya
          # eliminado de cmdline-tools) y rompe el setup. Solo platform-tools;
          # el AGP baja compileSdk/build-tools segun necesite.
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Keystore de la casa (si hay secrets)
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/levodev.p12"; echo "KEYSTORE_PATH=$RUNNER_TEMP/levodev.p12" >> "$GITHUB_ENV"; echo "firma: RELEASE"; else echo "firma: debug (sin KEYSTORE_B64)"; fi
      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        # [LP-F3] Las pruebas de unidad (render y busqueda) corren antes de armar el APK.
        run: gradle testReleaseUnitTest assembleRelease --no-daemon --stacktrace && cp app/build/outputs/apk/release/app-release.apk LevoPrint.apk

      # [Re-QA LP-F3 · BAJO 3] LevoPrint.json se arma y se VALIDA en cada run, antes de subir nada:
      # versionCode/versionName de app/build.gradle.kts (no se desalinean del APK) y url https.
      - name: Armar y validar LevoPrint.json
        env:
          NOTAS: ${{ inputs.notas }}
        run: |
          VC=$(grep -oE 'versionCode *= *[0-9]+' app/build.gradle.kts | head -1 | grep -oE '[0-9]+$')
          VN=$(grep -oE 'versionName *= *"[^"]+"' app/build.gradle.kts | head -1 | cut -d'"' -f2)
          echo "$VC" | grep -qE '^[0-9]+$' || { echo "versionCode no numerico: '$VC'"; exit 1; }
          echo "$VN" | grep -qE '^[0-9]+[.][0-9]+[.][0-9]+$' || { echo "versionName no es x.y.z: '$VN'"; exit 1; }
          jq -n --argjson vc "$VC" --arg vn "$VN" --arg notas "$NOTAS" --arg url "https://krfljsososdakbatevci.supabase.co/storage/v1/object/public/descargas/levoprint/LevoPrint.apk" '{versionCode: $vc, versionName: $vn, url: $url, notas: $notas}' > LevoPrint.json
          jq -e '(.versionCode|type) == "number" and .versionCode > 0 and (.versionName|length) > 0 and (.url|startswith("https://")) and (.notas|type) == "string"' LevoPrint.json > /dev/null || { echo "LevoPrint.json invalido: no se publica nada"; cat LevoPrint.json; exit 1; }
          cat LevoPrint.json

      # [RT-1] El artifact lleva el APK y su LevoPrint.json ya validado: es lo que publica
      # tools/publicar_bucket.mjs desde la PC de Luis (el CI no toca el bucket).
      - name: Subir APK y LevoPrint.json
        uses: actions/upload-artifact@v4
        with:
          name: LevoPrint-apk
          path: |
            LevoPrint.apk
            LevoPrint.json
          if-no-files-found: error
