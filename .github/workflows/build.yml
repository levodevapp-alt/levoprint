name: build-apk
# [QA LP-F3 · ALTO 1] Un merge a main ya NO publica solo: el CI se lanza a mano (Actions -> Run workflow).
# Compila y prueba siempre; publica al bucket solo desde main y con «publicar» marcado.
on:
  workflow_dispatch:
    inputs:
      publicar:
        description: 'Publicar al bucket de descargas (solo desde main)'
        type: boolean
        default: false
      notas:
        description: 'Notas de la version para LevoPrint.json (aviso de actualizacion del APK)'
        type: string
        default: ''
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          # El default del action incluye el paquete legacy 'tools' (ya
          # eliminado de cmdline-tools) y rompe el setup. Solo platform-tools;
          # el AGP baja compileSdk/build-tools segun necesite.
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Keystore de la casa (si hay secrets)
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/levodev.p12"; echo "KEYSTORE_PATH=$RUNNER_TEMP/levodev.p12" >> "$GITHUB_ENV"; echo "firma: RELEASE"; else echo "firma: debug (sin KEYSTORE_B64)"; fi
      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        # [LP-F3] Las pruebas de unidad (render y busqueda) corren antes de armar el APK.
        run: gradle testReleaseUnitTest assembleRelease --no-daemon --stacktrace && cp app/build/outputs/apk/release/app-release.apk LevoPrint.apk
      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: LevoPrint-apk
          path: LevoPrint.apk
          if-no-files-found: error

      # Publica el APK a la URL estable que usan los botones de descarga de
      # la consola (mi negocio > estaciones). Si no hay SUPABASE_SERVICE_KEY
      # el paso NO falla: solo deja el artifact y avisa.
      # [Re-QA LP-F3 · BAJO 3] LevoPrint.json se arma y se VALIDA en cada run, antes de subir nada:
      # versionCode/versionName de app/build.gradle.kts (no se desalinean del APK) y url https.
      - name: Armar y validar LevoPrint.json
        env:
          NOTAS: ${{ inputs.notas }}
        run: |
          VC=$(grep -oE 'versionCode *= *[0-9]+' app/build.gradle.kts | grep -oE '[0-9]+$')
          VN=$(grep -oE 'versionName *= *"[^"]+"' app/build.gradle.kts | cut -d'"' -f2)
          [ -n "$VC" ] && [ -n "$VN" ] || { echo "No se pudo leer la version de app/build.gradle.kts"; exit 1; }
          jq -n --argjson vc "$VC" --arg vn "$VN" --arg notas "$NOTAS" --arg url "https://krfljsososdakbatevci.supabase.co/storage/v1/object/public/descargas/levoprint/LevoPrint.apk" '{versionCode: $vc, versionName: $vn, url: $url, notas: $notas}' > LevoPrint.json
          jq -e '(.versionCode|type) == "number" and .versionCode > 0 and (.versionName|length) > 0 and (.url|startswith("https://")) and (.notas|type) == "string"' LevoPrint.json > /dev/null || { echo "LevoPrint.json invalido: no se publica nada"; cat LevoPrint.json; exit 1; }
          cat LevoPrint.json

      # [QA LP-F3 · ALTO 1] Solo desde main y con «publicar» marcado. Sube el APK y luego LevoPrint.json
      # (ya validado en el paso anterior: si fallaba, este paso ni corre).
      - name: Publicar al bucket de descargas (si hay service key)
        if: github.ref == 'refs/heads/main' && inputs.publicar == true
        env:
          SB_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          if [ -z "$SB_KEY" ]; then echo "Sin SUPABASE_SERVICE_KEY: no publico al bucket (queda solo el artifact)."; exit 0; fi
          [ -s LevoPrint.json ] || { echo "Falta LevoPrint.json validado: no se publica nada"; exit 1; }
          echo "Publicando LevoPrint.apk al bucket descargas/levoprint ..."
          code=$(curl -sS -o /tmp/r.txt -w "%{http_code}" -X POST "https://krfljsososdakbatevci.supabase.co/storage/v1/object/descargas/levoprint/LevoPrint.apk" -H "Authorization: Bearer $SB_KEY" -H "x-upsert: true" -H "Content-Type: application/vnd.android.package-archive" --data-binary @LevoPrint.apk)
          echo "HTTP $code"; cat /tmp/r.txt; echo
          [ "$code" = "200" ] || { echo "Fallo la publicacion al bucket"; exit 1; }
          echo "APK publicado a descargas/levoprint/LevoPrint.apk"
          code=$(curl -sS -o /tmp/r2.txt -w "%{http_code}" -X POST "https://krfljsososdakbatevci.supabase.co/storage/v1/object/descargas/levoprint/LevoPrint.json" -H "Authorization: Bearer $SB_KEY" -H "x-upsert: true" -H "Cache-Control: no-cache" -H "Content-Type: application/json" --data-binary @LevoPrint.json)
          echo "HTTP $code"; cat /tmp/r2.txt; echo
          [ "$code" = "200" ] || { echo "Fallo la publicacion de LevoPrint.json"; exit 1; }
          echo "LevoPrint.json publicado"
