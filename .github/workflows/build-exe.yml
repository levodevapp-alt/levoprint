name: build-exe
# [QA LP-F3 · ALTO 1] Un merge a main ya NO publica solo: el CI se lanza a mano (Actions -> Run workflow).
# [RT-1 · 11-nov] Este repo es PUBLICO: el CI ya NO usa SUPABASE_SERVICE_KEY ni publica al bucket.
# Solo prueba, compila y deja el artifact (LevoPrint-Windows.zip listo para el boton "Descargar (PC)").
# La publicacion la hace Luis desde su PC con tools/publicar_bucket.mjs (la llave nunca sale de su .env).
on:
  workflow_dispatch:
# [RT-1] GITHUB_TOKEN con el minimo: solo lectura del codigo.
permissions:
  contents: read
jobs:
  exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # [O-23] El render local del agente (TURNO, pie ASCII, COPIA…) se prueba ANTES de compilar:
      # si falla, no sale un .exe nuevo.
      - name: Probar el render del agente
        run: node agente/prueba_render.cjs
      # [LP-F3] Busqueda, destino por estacion, modo 1.12, guardas y USB (con un doble de PowerShell).
      - name: Prueba de integracion del agente
        run: node agente/prueba_integracion.cjs
      - name: Instalar postject
        working-directory: agente
        run: npm install --no-save postject@1.0.0-alpha.6
      - name: Compilar LevoPrint.exe (Node SEA)
        working-directory: agente
        run: node build-exe.mjs
      # Empaqueta el .exe en el ZIP que espera el boton "Descargar (PC)" de la consola.
      - name: Empaquetar LevoPrint-Windows.zip
        shell: pwsh
        working-directory: agente
        run: Compress-Archive -Path dist/LevoPrint.exe -DestinationPath dist/LevoPrint-Windows.zip -Force
      - name: Subir .exe y .zip
        uses: actions/upload-artifact@v4
        with:
          name: LevoPrint-exe
          path: |
            agente/dist/LevoPrint.exe
            agente/dist/LevoPrint-Windows.zip
          if-no-files-found: error
